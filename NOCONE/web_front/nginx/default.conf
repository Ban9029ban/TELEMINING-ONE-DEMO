server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data: blob: http: https:; media-src 'self' data: blob: http: https:; font-src 'self' data: http: https: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; worker-src 'self' blob:; frame-src 'self' blob: http: https:; child-src 'self' blob: http: https:; connect-src 'self' http://localhost http://localhost:8090 http://127.0.0.1 http://127.0.0.1:8090 http://tmone.denial.cl https://tmone.denial.cl http://tmone.denial.cl:8090 https://tmone.denial.cl:8090 ws://tmone.denial.cl wss://tmone.denial.cl ws://tmone.denial.cl:8090 wss://tmone.denial.cl:8090;" always;

  location / {
    try_files $uri /index.html;
  }

  location /js/ {
    try_files $uri =404;
    access_log off;
  }

  location /videos/ {
    try_files $uri =404;
    access_log off;
    expires 1h;
    add_header Cache-Control "public";
  }

  location /models/ {
    try_files $uri =404;
    access_log off;
    expires 1h;
    add_header Cache-Control "public";
  }

  location /api/ {
    # Preserva la ruta original (/api/...) y usa el nombre estable del contenedor backend.
    proxy_pass http://zenit-backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    proxy_buffering off;
  }

  location = /legacy-sismico {
    return 302 /legacy-sismico/;
  }

  location /legacy-sismico/ {
    try_files $uri /sismico-ui/index.html;
  }

  location /sismico-ui/ { try_files $uri =404; }
  location /assets/ { alias /usr/share/nginx/html/sismico-ui/assets/; }
  location /sounds/ { alias /usr/share/nginx/html/sismico-ui/sounds/; }
  location /legacy/ { alias /usr/share/nginx/html/sismico-ui/legacy/; }

  # Fuente sísmica local: las lecturas salen desde este equipo hacia Codelco.
  location /sismico-source-api/ {
    resolver 127.0.0.11 valid=10s;
    set $sismico_backend http://sismico-api:8000;
    rewrite ^/sismico-source-api/(.*)$ /$1 break;
    proxy_pass $sismico_backend;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
}
