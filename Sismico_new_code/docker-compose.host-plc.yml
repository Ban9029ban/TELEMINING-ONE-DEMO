services:
  backend:
    network_mode: host
    ports: []
    extra_hosts: []
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: 15432
      OLLAMA_URL: http://127.0.0.1:18134
      SEMAFORO_EMULATOR_URL: http://127.0.0.1:19090/api/emulator/semaforo/state

  sismico_poller:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_URL: http://host.docker.internal:18000/api/sismico/polling/run
      BACKEND_BASE_URL: http://host.docker.internal:18000
      CAPTURE_ENDPOINTS_URL: http://host.docker.internal:18000/api/sismico/capture/endpoints
      CAPTURE_STORE_URL: http://host.docker.internal:18000/api/sismico/capture/store

